<!DOCTYPE html>
<html  xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>profile</title>
</head>
<body>

<th:block th:insert="~{Header.html}"></th:block>  
	<div class="container-fluid">
		<div class="card">
			<div class="card-header bg-primary text-center text-white">
				<h4>User Details</h4>
			</div>
			<div class="card-body ">


					<div class="row p-2">
						<div class="col-4">FirstName</div>
						<div class="col-6">
						

							[[${session.activeuser.fname}]]

						</div>
					</div>
					
					<div class="row p-2">
						<div class="col-4">LastName</div>
						<div class="col-6">
						

							[[${session.activeuser.lname}]]

						</div>
					</div>
					
					<div class="row p-2">
						<div class="col-4">UserName</div>
						<div class="col-6">
						

							[[${session.activeuser.username}]]

						</div>
					</div>
			</div>
			<div class="card-footer bg-warning text-center text-white">
				@copyright2025</div>
			
		</div>
	</div>
</body>
</html>
