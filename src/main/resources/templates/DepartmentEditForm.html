<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>departmentedit</title>
<!-- Latest compiled and minified CSS -->

</head>
<body>
<th:block th:insert="~{Header.html}"></th:block>

	<div class="container-fluid">
		<div class="card">
			<div class="card-header bg-primary text-center text-white">
				<h4>Department Edit Form</h4>
			</div>
			<div class="card-body ">

				<form action="/dept/update" method ="post" th:object=${dObject}>

					<div class="row p-2">
						<div class="col-4">Department Name</div>
						<div class="col-6">

							<input type="text" th:field="*{dptName}" class="form-control">

						</div>
					</div>

					<div class="row p-2">
						<div class="col-4">Department Head (Hod)</div>
						<div class="col-6">

							<input type="text" th:field="*{dptHead}" class="form-control">

						</div>
					</div>

					<div class="row p-2">
						<div class="col-4">Department Phone</div>
						<div class="col-6">

							<input type="text" th:field="*{dptPhone}" class="form-control">

						</div>
					</div>

					<div class="row p-2">
						<div class="col-4"></div>
						<div class="col-6">

							<input type="submit" value="Update"
								class="btn btn-success btn-lg">

						</div>
					</div>
					<input type = "hidden" th:field="*{id}">


				</form>

			</div>
			<div class="card-footer bg-warning text-center text-white">
				@copyright2025</div>
			
		</div>
	</div>
</body>
</html>
